plugins { id 'com.android.application' }

def localSigning = new Properties()
def releaseProperties = rootProject.file('signing/local.properties')
if (releaseProperties.exists()) releaseProperties.withInputStream { localSigning.load(it) }
def managerDigest = providers.gradleProperty('managerCertificateSha256').orNull
if (!(managerDigest ==~ /[0-9a-fA-F]{64}/)) {
    throw new GradleException('Pass -PmanagerCertificateSha256 with the Manager APK certificate digest')
}

android {
    namespace 'io.qweovo.brokerprobe'
    compileSdk 34
    buildFeatures { buildConfig true }
    defaultConfig {
        applicationId 'io.qweovo.brokerprobe'
        minSdk 33
        targetSdk 35
        buildConfigField 'String', 'MANAGER_CERTIFICATE_SHA256', '"' + managerDigest + '"'
    }
    signingConfigs {
        localRelease {
            storeFile rootProject.file('signing/qweovo-manager.jks')
            storePassword localSigning.getProperty('storePassword')
            keyAlias localSigning.getProperty('keyAlias')
            keyPassword localSigning.getProperty('keyPassword')
        }
    }
    buildTypes {
        release { if (releaseProperties.exists()) signingConfig signingConfigs.localRelease }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    sourceSets.main.java.srcDir rootProject.file('manager-protocol/src/main/java')
}
